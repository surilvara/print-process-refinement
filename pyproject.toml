[project]
name = "print-document-pipeline"
version = "1.0.0"
description = "Modular pipeline for extracting structured information from scanned newspaper/magazine images"
requires-python = ">=3.10"
dependencies = [
    "python-doctr[torch]",
    "transformers",
    "torch",
    "torchvision",
    "spacy",
    "Pillow",
    "pypdfium2",
    "loguru",
    "pyyaml",
    "opencv-python",
    "paddlepaddle",
    "paddleocr[doc-parser]",
    "pyahocorasick",
    "anthropic>=0.39.0",
    "streamlit>=1.36",

    "mlx-vlm>=0.3.11; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
pipeline = "main:main"

[tool.setuptools.packages.find]
where = ["open_src"]
