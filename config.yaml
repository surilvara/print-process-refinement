# Pipeline model configuration — swap models by changing values here
models:
  ocr:
    backend: "paddleocr_vl"
    model_name: "PaddleOCR-VL-1.5"  # label only; pipeline weights are picked by paddleocr
    # Apple Silicon GPU: offload VLM recognition to a local MLX-VLM server.
    # Start it with `./scripts/start_mlx_server.sh` before running the pipeline.
    # Comment these three lines out to fall back to CPU-only PaddlePaddle.
    vl_rec_backend: "mlx-vlm-server"
    # MLX-VLM exposes an OpenAI-compatible API under /v1 — the suffix is required,
    # otherwise PaddleOCR's client posts to /chat/completions and the server 404s
    # while PaddleOCR silently falls back to slow CPU inference.
    vl_rec_server_url: "http://localhost:8111/v1"
    # Must match the model the MLX server preloaded (see scripts/start_mlx_server.sh).
    # Mismatch forces MLX to unload + reload, costing minutes per run.
    vl_rec_api_model_name: "mlx-community/PaddleOCR-VL-1.5-bf16"
  layout:
    backend: "paddleocr_vl"  # shares the same instance as ocr when backend matches
    model_name: "PaddleOCR-VL-1.5"  # label only; overridden by ocr instance
  ner:
    backend: "spacy"
    model_name: "en_core_web_trf"
  image_analysis:
    backend: "owlv2"
    model_name: "google/owlv2-base-patch16-ensemble"
    confidence_threshold: 0.3

# Remap spaCy entity labels to domain-specific names.
# Key: spaCy label, Value: label to use in output.
# Full list of spaCy labels: PERSON, NORP, FAC, ORG, GPE, LOC, PRODUCT,
#   EVENT, WORK_OF_ART, LAW, LANGUAGE, DATE, TIME, PERCENT, MONEY,
#   QUANTITY, ORDINAL, CARDINAL
label_remapping:
  ORG: "BRAND"

# OWLv2 detection prompts — add/remove as needed
detection_prompts:
  people:
    - "person"
    - "face"
    - "model"
  logos:
    - "brand logo"
    - "logo"
  fashion_beauty:
    - "clothing"
    - "accessories"
    - "perfume"
    - "makeup"
    - "watch"
    - "jewellery"
    - "handbag"
    - "shoes"
  advertising:
    - "advertisement"
    - "product advertisement"

# Output settings
output:
  directory: "output"
  include_timestamp: true
  include_model_names: true

# Logging
logging:
  level: "INFO"
  file: "logs/pipeline.log"
